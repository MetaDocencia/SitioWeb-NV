{{- /*
  Estilos de la página /cta/ (propuesta A: entrada y lista).
  Se inyectan una sola vez por página, aunque los shortcodes se usen varias veces.
  Si prefieres moverlos al CSS global del sitio, copia el contenido de <style>
  a assets/css/custom.css y deja este partial vacío.

  Decisiones:
  - El bloque markdown de Hugo Blox envuelve el contenido en varios contenedores,
    uno de ellos con max-w-prose (595px) y items-center. Las primeras reglas
    liberan esa cadena solo donde está esta maqueta.
  - Ningún color de texto fijo fuera de la entrada: el cuerpo hereda el color del
    tema, así la página sigue funcionando en modo oscuro sin reglas extra.
  - Botón: radio 4px, padding .625rem/1.25rem y peso 600, igual que el resto del sitio.
  - El formulario de Mailchimp se integra en la banda azul: los campos se apuntan
    por el name del input (EMAIL, FNAME, LNAME, MMERGE7, MMERGE9), así que si en
    Mailchimp se agrega o renombra un campo, hay que actualizar esos selectores.
*/ -}}
{{- $p := .Page -}}
{{- if not ($p.Scratch.Get "md_cta_css") -}}
{{- $p.Scratch.Set "md_cta_css" true -}}
<style>
/* ---------- ancho ----------
   Hugo Blox anida el contenido en .prose > .flex.max-w-prose.items-center, y es
   ese contenedor el que recorta la página a 595px. Liberamos cualquier ancestro
   que contenga la maqueta, no solo el padre directo.
   Para cambiar el ancho de la página, tocar --md-cta-max y nada más.          */
:is(div,article):has(.md-cta-hero),
:is(div,article):has(.md-cta-item){
  max-width:none !important;
  width:100% !important;
  align-items:stretch !important;
}

.md-cta-hero,
.md-cta-item{
  --md-cta-max:80rem;   /* 1280px. Para igualar las tarjetas del resto del sitio: 64rem */
}

/* ---------- entrada: título de la página + boletín ---------- */
.md-cta-hero{
  background:#00506F;
  color:#fff;
  padding:clamp(2rem,5vw,4rem) clamp(1rem,4vw,2.5rem);
}
.md-cta-hero__in{
  box-sizing:border-box;
  max-width:var(--md-cta-max);
  margin-inline:auto;
}
.md-cta-hero .md-cta-hero__title{
  margin:0;color:#fff;
  font-size:clamp(2rem,5.5vw,3.75rem);
  font-weight:700;line-height:1.05;letter-spacing:-.025em;
  text-wrap:balance;
}
.md-cta-hero .md-cta-hero__sub{
  margin:1.75rem 0 .35rem;color:#fff;
  font-size:1.25rem;font-weight:700;line-height:1.3;
}
.md-cta-hero .md-cta-hero__lead{
  margin:0;max-width:46ch;
  font-size:1.125rem;line-height:1.625;color:rgba(255,255,255,.92);
}
.md-cta-hero__form{margin-top:1.5rem;max-width:44rem}
.md-cta-hero__more{margin:1.25rem 0 0}
.md-cta-hero .md-cta-hero__more a{
  color:#fff;font-weight:600;text-decoration:underline;text-underline-offset:3px;
}

/* ---------- formulario de Mailchimp dentro de la banda ----------
   Se le quita la caja blanca y los campos cortos se agrupan de a dos, para que
   el formulario no quede mucho más alto que el título de al lado.
   Para volver a la caja blanca original, borrar este bloque entero.          */
.md-cta-hero #mc_embed_signup{
  background:transparent;border:0;padding:0;border-radius:0;
}
.md-cta-hero #mc_embed_signup_scroll{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  column-gap:1rem;
}
.md-cta-hero #mc_embed_signup_scroll > *{
  grid-column:1 / -1;
  margin-bottom:.75rem;
}
.md-cta-hero #mc_embed_signup_scroll > div:has(input[name="FNAME"]),
.md-cta-hero #mc_embed_signup_scroll > div:has(input[name="LNAME"]),
.md-cta-hero #mc_embed_signup_scroll > div:has(input[name="MMERGE7"]),
.md-cta-hero #mc_embed_signup_scroll > div:has(input[name="MMERGE9"]){
  grid-column:span 1;
}
.md-cta-hero #mc_embed_signup label{color:#fff;font-weight:600}
.md-cta-hero #mc_embed_signup .text-gray-600{color:rgba(255,255,255,.8)}
.md-cta-hero #mc_embed_signup .text-red-500{color:#FFC4C4}
.md-cta-hero #mc_embed_signup input[type="email"],
.md-cta-hero #mc_embed_signup input[type="text"]{
  background:rgba(255,255,255,.12);
  border-color:rgba(255,255,255,.45);
  color:#fff;
  border-radius:.25rem;
}
.md-cta-hero #mc_embed_signup input::placeholder{color:rgba(255,255,255,.6)}
.md-cta-hero #mc_embed_signup input[type="email"]:focus,
.md-cta-hero #mc_embed_signup input[type="text"]:focus{
  background:rgba(255,255,255,.18);
  border-color:#fff;
  outline:2px solid rgba(255,255,255,.5);outline-offset:1px;
}
.md-cta-hero #mc_embed_signup input[type="submit"]{
  background:#fff !important;   /* el embed trae bg-[#C83737]; para volver al rojo, borrar esta línea */
  color:#00506F;
  border-radius:.25rem;
  font-weight:700;
  padding:.625rem 1.25rem;
}

/* ---------- lista: una sección por forma de participar ---------- */
.md-cta-item{
  box-sizing:border-box;
  max-width:var(--md-cta-max);margin-inline:auto;
  padding-block:clamp(1.75rem,4vw,3rem);
  padding-inline:clamp(1rem,4vw,2.5rem);
  display:grid;
  grid-template-columns:4px minmax(0,1fr);
  grid-template-areas:
    "bar head"
    "bar main";
  column-gap:clamp(1rem,3vw,1.75rem);
  row-gap:.5rem;
  border-top:1px solid color-mix(in srgb, currentColor 18%, transparent);
}
.md-cta-item:first-of-type{border-top:0}
.md-cta-item__bar{
  grid-area:bar;
  border-radius:2px;
  background:var(--md-cta-accent,#00506F);
}
.md-cta-item__head{grid-area:head}
.md-cta-item__main{grid-area:main;min-width:0}
.md-cta-item .md-cta-item__title{
  margin:0;
  font-size:clamp(1.5rem,3.2vw,2.25rem);
  font-weight:700;line-height:1.12;letter-spacing:-.025em;
  text-wrap:balance;
}
.md-cta-item__body{font-size:1.125rem;line-height:1.625;max-width:62ch}
.md-cta-item .md-cta-item__body p{margin:0 0 .75rem}
.md-cta-item .md-cta-item__body p:last-child{margin-bottom:0}
.md-cta-item__actions{
  display:flex;flex-wrap:wrap;align-items:center;
  gap:.875rem 1.125rem;margin-top:1.25rem;
}
.md-cta-item .md-cta-item__link{
  font-weight:600;text-decoration:underline;text-underline-offset:3px;
}
.md-cta-item .md-cta-item__btn{
  display:inline-block;
  padding:.625rem 1.25rem;
  border:2px solid transparent;border-radius:.25rem;
  font-weight:600;line-height:1.5;
  text-decoration:none !important;   /* el contenedor .prose subraya todos los enlaces */
  background:var(--md-cta-accent,#00506F);color:#fff;
  transition:filter .15s ease;
}
.md-cta-item .md-cta-item__btn:hover{filter:brightness(.92)}
.md-cta-item__btn:focus-visible,
.md-cta-item__link:focus-visible,
.md-cta-hero__more a:focus-visible{
  outline:2px solid currentColor;outline-offset:2px;
}

/* ---------- pantallas anchas: dos columnas ----------
   En la lista, a partir de 1024px el título pasa a la izquierda y el cuerpo a la
   derecha. En la entrada recién a partir de 1152px, con la columna del título más
   angosta que la del boletín (2fr contra 3fr).
   Para volver a una sola columna, borrar el bloque que corresponda.          */
@media (min-width:64em){
  .md-cta-item{
    grid-template-columns:4px minmax(0,20rem) minmax(0,1fr);
    grid-template-areas:"bar head main";
    column-gap:clamp(1.5rem,4vw,3rem);
  }
  .md-cta-item__actions{margin-top:1rem}
}

@media (min-width:72em){
  .md-cta-hero__in{
    display:grid;
    grid-template-columns:minmax(0,2fr) minmax(0,3fr);
    gap:clamp(2rem,4vw,3.5rem);
    align-items:start;
  }
  .md-cta-hero .md-cta-hero__sub{margin-top:0}
  .md-cta-hero__form{max-width:none}
}

/* ---------- celular ---------- */
@media (max-width:36rem){
  .md-cta-hero #mc_embed_signup_scroll{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:640px){
  .md-cta-item{grid-template-columns:3px minmax(0,1fr);column-gap:.875rem}
  .md-cta-item__actions{flex-direction:column;align-items:stretch;gap:.75rem}
  .md-cta-item .md-cta-item__btn{text-align:center;padding:.8125rem 1.25rem}
  .md-cta-item .md-cta-item__link{text-align:center}
}

@media (prefers-reduced-motion:reduce){
  .md-cta-item .md-cta-item__btn{transition:none}
}
</style>
{{- end -}}
